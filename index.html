<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RoFlix - Xem Phim Trực Tuyến</title>
    
    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/themes.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/responsive.css">
    
    <!-- CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <!-- Particles Canvas -->
    <canvas id="particles-canvas"></canvas>

    <!-- Toast Container -->
    <div id="toast-container" class="fixed top-20 right-5 z-50 flex flex-col gap-3 pointer-events-none max-w-sm w-full"></div>
    <div id="gem-fly-container"></div>

    <!-- User Nav Container -->
    <div id="user-nav-container" class="fixed top-4 right-20 z-50 flex items-center"></div>

    <div id="roflix-app-root" class="min-h-screen flex flex-col justify-between relative" style="z-index: 1;">
        <div id="app-content"></div>
    </div>

    <!-- Auth Modal -->
    <div id="auth-modal" class="modal-overlay hidden">
        <div class="modal-content glass-premium w-full max-w-4xl grid grid-cols-1 md:grid-cols-2 relative p-0 overflow-hidden">
            <button onclick="closeAuthModal()" class="absolute top-4 right-4 text-gray-400 hover:text-white text-xl z-10 w-8 h-8 rounded-full flex items-center justify-center bg-black/30 hover:bg-black/50 transition">
                <i class="fa-solid fa-xmark"></i>
            </button>

            <div class="hidden md:flex flex-col justify-between p-8 bg-gradient-to-br from-[#121420] via-[#1b1f33] to-[#0f1018] relative overflow-hidden min-h-[400px]">
                <div class="absolute inset-0 opacity-20 bg-cover bg-center" style="background-image: url('https://image.tmdb.org/t/p/original/8cdWjvZQUxUj6l1O3lB1K4G5H7J.jpg');"></div>
                <div class="relative z-10">
                    <div class="flex items-center space-x-2 mb-4">
                        <div class="bg-gradient-to-r from-amber-500 to-purple-600 text-white w-10 h-10 rounded-full flex items-center justify-center font-bold">
                            <i class="fa-solid fa-play ml-0.5 text-sm"></i>
                        </div>
                        <span class="text-2xl font-black text-white">Ro<span class="text-gradient">Flix</span></span>
                    </div>
                    <p class="text-sm text-gray-400">Xem phim chất lượng cao hoàn toàn miễn phí.</p>
                </div>
                <div class="relative z-10 space-y-3">
                    <div class="bg-amber-500/10 border border-amber-500/30 text-amber-400 text-xs p-3 rounded-xl flex items-center gap-2">
                        <i class="fa-solid fa-shield-halved"></i> <span>Bảo mật dữ liệu cá nhân tuyệt đối.</span>
                    </div>
                    <div class="bg-purple-500/10 border border-purple-500/30 text-purple-400 text-xs p-3 rounded-xl flex items-center gap-2">
                        <i class="fa-solid fa-rocket"></i> <span>Đăng nhập để lưu lịch sử và yêu thích.</span>
                    </div>
                </div>
            </div>

            <div class="p-6 md:p-8 flex flex-col justify-center">
                <div id="login-form-box">
                    <h2 class="text-2xl font-black text-white text-center mb-6">ĐĂNG NHẬP</h2>
                    <button onclick="mockGoogleAuth()" class="w-full bg-white hover:bg-gray-100 text-gray-900 font-bold py-3 rounded-full text-xs flex items-center justify-center gap-2 mb-4 transition btn-ripple">
                        <svg class="w-4 h-4" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
                        <span>Đăng nhập bằng Google</span>
                    </button>
                    <div class="text-center text-xs text-gray-500 my-3">Hoặc</div>
                    <form onsubmit="handleLogin(event)" class="space-y-3">
                        <input id="login-email" type="text" required placeholder="Email hoặc tên đăng nhập" class="w-full bg-[#11131f] border border-gray-700 focus:border-amber-500 rounded-xl px-4 py-3 text-sm text-white focus:outline-none transition">
                        <div class="relative">
                            <input id="login-password" type="password" required placeholder="Mật khẩu" class="w-full bg-[#11131f] border border-gray-700 focus:border-amber-500 rounded-xl px-4 py-3 text-sm text-white focus:outline-none transition pr-20">
                            <a href="#" onclick="showToast('info', 'Khôi phục mật khẩu', 'Vui lòng kiểm tra email của bạn!'); return false;" class="absolute right-3 top-3 text-[11px] text-amber-500 hover:underline">Quên mật khẩu?</a>
                        </div>
                        <div class="flex items-center justify-between py-1 text-xs text-gray-400">
                            <label class="flex items-center gap-2 cursor-pointer">
                                <input type="checkbox" checked class="rounded accent-amber-500">
                                <span>Lưu mật khẩu</span>
                            </label>
                        </div>
                        <button type="submit" class="w-full bg-gradient-to-r from-amber-500 to-yellow-500 hover:from-amber-600 hover:to-yellow-600 text-black font-black py-3 rounded-xl text-sm uppercase tracking-wider shadow-lg transition active:scale-95 btn-ripple">
                            ĐĂNG NHẬP
                        </button>
                    </form>
                    <p class="text-xs text-center text-gray-400 mt-5">
                        Chưa có tài khoản? 
                        <button onclick="switchAuthMode('register')" class="bg-amber-500 text-black font-extrabold px-3 py-1 rounded-full text-[11px] ml-1 hover:bg-amber-400 transition">ĐĂNG KÝ</button> ngay!
                    </p>
                </div>

                <div id="register-form-box" class="hidden">
                    <h2 class="text-2xl font-black text-white text-center mb-6">ĐĂNG KÝ</h2>
                    <form onsubmit="handleRegister(event)" class="space-y-3">
                        <input id="reg-name" type="text" required placeholder="Tên hiển thị" class="w-full bg-[#11131f] border border-gray-700 focus:border-amber-500 rounded-xl px-4 py-3 text-sm text-white focus:outline-none transition">
                        <input id="reg-email" type="email" required placeholder="Địa chỉ Email" class="w-full bg-[#11131f] border border-gray-700 focus:border-amber-500 rounded-xl px-4 py-3 text-sm text-white focus:outline-none transition">
                        <input id="reg-password" type="password" required placeholder="Mật khẩu (tối thiểu 6 ký tự)" class="w-full bg-[#11131f] border border-gray-700 focus:border-amber-500 rounded-xl px-4 py-3 text-sm text-white focus:outline-none transition">
                        <input id="reg-confirm" type="password" required placeholder="Xác nhận mật khẩu" class="w-full bg-[#11131f] border border-gray-700 focus:border-amber-500 rounded-xl px-4 py-3 text-sm text-white focus:outline-none transition">
                        <button type="submit" class="w-full bg-gradient-to-r from-amber-500 to-yellow-500 hover:from-amber-600 hover:to-yellow-600 text-black font-black py-3 rounded-xl text-sm uppercase tracking-wider shadow-lg transition active:scale-95 btn-ripple mt-2">
                            TẠO TÀI KHOẢN
                        </button>
                    </form>
                    <p class="text-xs text-center text-gray-400 mt-5">
                        Đã có tài khoản? 
                        <button onclick="switchAuthMode('login')" class="text-amber-500 font-bold hover:underline ml-1">Đăng nhập</button>
                    </p>
                </div>
            </div>
        </div>
    </div>

    <!-- Edit Profile Modal -->
    <div id="edit-profile-modal" class="modal-overlay hidden edit-profile-modal">
        <div class="modal-content glass-premium">
            <h2 style="font-size:1.5rem; font-weight:900; color:var(--ro-text-primary); margin-bottom:24px;">✏️ Chỉnh sửa hồ sơ</h2>
            <form id="edit-profile-form">
                <div class="form-group">
                    <label>Tên hiển thị</label>
                    <input id="edit-name" type="text" placeholder="Tên của bạn...">
                </div>
                <div class="form-group">
                    <label>Giới thiệu</label>
                    <textarea id="edit-bio" placeholder="Giới thiệu về bạn..."></textarea>
                </div>
                <div class="form-group">
                    <label>Quốc gia</label>
                    <select id="edit-country">
                        <option value="Việt Nam">🇻🇳 Việt Nam</option>
                        <option value="Mỹ">🇺🇸 Mỹ</option>
                        <option value="Anh">🇬🇧 Anh</option>
                        <option value="Hàn Quốc">🇰🇷 Hàn Quốc</option>
                        <option value="Nhật Bản">🇯🇵 Nhật Bản</option>
                        <option value="Khác">🌍 Khác</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Phim yêu thích</label>
                    <input id="edit-fav-movie" type="text" placeholder="Tên phim yêu thích...">
                </div>
                <div class="form-group">
                    <label>Ngày sinh</label>
                    <input id="edit-birthday" type="date">
                </div>
                <div class="form-group">
                    <label>URL ảnh Banner</label>
                    <input id="edit-banner" type="url" placeholder="https://example.com/banner.jpg">
                    <small style="color:var(--ro-text-muted); font-size:0.7rem;">Dán link ảnh banner (không bắt buộc)</small>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn-cancel" onclick="closeEditProfile()">Hủy</button>
                    <button type="submit" class="btn-save">Lưu thay đổi</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Gacha Pull Overlay -->
    <div class="gacha-pull-overlay" id="gacha-pull-overlay">
        <div class="pull-card" id="gacha-pull-card">
            <div class="pull-rarity" id="pull-rarity">✨ Common</div>
            <img class="pull-art" id="pull-art" src="" alt="Card">
            <div class="pull-name" id="pull-name">Nhân vật</div>
            <div class="pull-movie" id="pull-movie">Từ phim</div>
            <button class="pull-close-btn" onclick="closeGachaPull()">Tuyệt vời! ✨</button>
        </div>
    </div>

    <!-- JavaScript -->
    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/movie.js"></script>
    <script src="js/player.js"></script>
    <script src="js/profile.js"></script>
    <script src="js/gamification.js"></script>
    <script src="js/gacha.js"></script>
    <script src="js/favorites.js"></script>
    <script src="js/comments.js"></script>
    <script src="js/rating.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
